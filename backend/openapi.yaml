openapi: 3.0.3
info:
  title: Vocab Flashcards API
  version: 1.0.0
servers:
  - url: https://CHANGE-ME.example.com/api/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password, fullName]
              properties:
                username: {type: string}
                email: {type: string, format: email}
                password: {type: string, minLength: 8}
                fullName: {type: string}
                studentId: {type: string}
      responses:
        '201': {$ref: '#/components/responses/AuthOk'}
        '409': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
      responses:
        '200': {$ref: '#/components/responses/AuthOk'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/google:
    post:
      summary: Login with Google ID token (optional, see docs/architecture.md)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: {type: string}
      responses:
        '200': {$ref: '#/components/responses/AuthOk'}
        '401': {$ref: '#/components/responses/Error'}
  /me:
    get:
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}
    put:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: {type: string}
                studentId: {type: string}
                email: {type: string, format: email}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}
  /categories:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Category'}
  /cards:
    get:
      parameters:
        - {name: category, in: query, schema: {type: integer}}
        - {name: remembered, in: query, schema: {type: boolean}}
        - {name: q, in: query, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Card'}
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CardInput'}}}
      responses:
        '201':
          description: Created
          content: {application/json: {schema: {$ref: '#/components/schemas/Card'}}}
  /cards/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    put:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CardInput'}}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {$ref: '#/components/schemas/Card'}}}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/Error'}
  /cards/{id}/remembered:
    patch:
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remembered]
              properties:
                remembered: {type: boolean}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {$ref: '#/components/schemas/Card'}}}
  /quizzes:
    post:
      summary: Submit answers; server grades and stores them
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                categoryId: {type: integer, nullable: true}
                answers:
                  type: array
                  items:
                    type: object
                    required: [cardId, selected]
                    properties:
                      cardId: {type: integer}
                      selected: {type: string}
      responses:
        '201':
          description: Graded
          content: {application/json: {schema: {$ref: '#/components/schemas/QuizResult'}}}
    get:
      summary: History, newest first (first item = latest)
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 20}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/QuizResult'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    AuthOk:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              token: {type: string}
              user: {$ref: '#/components/schemas/User'}
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: {type: string}
                  message: {type: string}
  schemas:
    User:
      type: object
      properties:
        id: {type: integer}
        username: {type: string}
        email: {type: string}
        fullName: {type: string}
        studentId: {type: string, nullable: true}
    Category:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
    CardInput:
      type: object
      required: [word, meaningTh]
      properties:
        word: {type: string}
        partOfSpeech: {type: string}
        meaningTh: {type: string}
        example: {type: string}
        categoryId: {type: integer, nullable: true}
    Card:
      allOf:
        - $ref: '#/components/schemas/CardInput'
        - type: object
          properties:
            id: {type: integer}
            remembered: {type: boolean}
            createdAt: {type: string, format: date-time}
    QuizResult:
      type: object
      properties:
        id: {type: integer}
        score: {type: integer}
        total: {type: integer}
        testedAt: {type: string, format: date-time}

